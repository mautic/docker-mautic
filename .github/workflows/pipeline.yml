name: Docker image pipeline
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'common/**'
      - 'tests/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      mautic_version:
        description: 'Mautic version (has to be a valid version from `mautic/recommended-project`)'
        required: true
      overwrite_latest_major:
        type: boolean
        description: 'Overwrite latest major tag (e.g. `5`). This should only be checked if you are releasing the latest release.'
      overwrite_latest_minor:
        type: boolean
        description: 'Overwrite latest minor tag (e.g. `5.0`). This should only be checked if you are releasing the latest release within the minor release.'
      tag_as_latest:
        type: boolean
        description: 'Tag this release as latest'

env:
  REGISTRY: ghcr.io
  DOCKERHUB_USERNAME: molluxmollux
  IMAGE_NAME: ${{ github.repository }}
  MAUTIC_VERSION: ${{ inputs.mautic_version || '7.2.1' }}

jobs:
  hadolint:
    runs-on: ubuntu-latest
    continue-on-error: true # Temporary workaround
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: fs
          scan-ref: .
          format: ${{ github.event_name == 'workflow_dispatch' && 'sarif' || 'table' }}
          exit_code: '0'
          ignore_unfixed: 'true'
          trivyignores: '.trivyignore'
          output: ${{ github.event_name == 'workflow_dispatch' && 'trivy-results.sarif' || '' }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name == 'workflow_dispatch'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  compute-base-tag:
    runs-on: ubuntu-latest
    outputs:
      php_version: ${{ steps.version.outputs.php_version }}
    steps:
      - name: Compute PHP version from Mautic version
        id: version
        env:
          MAUTIC_VERSION: ${{ env.MAUTIC_VERSION }}
        run: |
          MAJOR="${MAUTIC_VERSION%%.*}"
          if [ "$MAJOR" = "5" ]; then PHPVER="8.2";
          elif [ "$MAJOR" = "6" ] || [ "$MAJOR" = "7" ]; then PHPVER="8.3";
          else echo "Unsupported Mautic major version: $MAJOR"; exit 1; fi
          echo "php_version=$PHPVER" >> "$GITHUB_OUTPUT"

  set-build-date:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.date.outputs.build_date }}
    steps:
      - name: Set build date
        id: date
        run: echo "build_date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  test-build:
    runs-on: ubuntu-latest
    needs: [compute-base-tag, hadolint, trivy-fs]
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image and export locally
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          tags: mautic-${{ matrix.image_type }}
          load: true
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ needs.compute-base-tag.outputs.php_version }}-${{ matrix.image_type }}-bookworm
            MAUTIC_VERSION=${{ env.MAUTIC_VERSION }}
            FLAVOUR=${{ matrix.image_type }}

      - name: Save image to tar file
        run: docker save mautic-${{ matrix.image_type }} -o image.tar

      - name: Upload image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: mautic-${{ matrix.image_type }}
          path: image.tar
  
  publish-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [compute-base-tag, hadolint, trivy-fs]
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker image build cache
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_TAG=${{ needs.compute-base-tag.outputs.php_version }}-${{ matrix.image_type }}-bookworm
            MAUTIC_VERSION=${{ inputs.mautic_version }}
            FLAVOUR=${{ matrix.image_type }}
          cache-from: type=gha,scope=mautic-${{ matrix.image_type }}
          cache-to: type=gha,scope=mautic-${{ matrix.image_type }},mode=max

  test-demo-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Apache test image
        uses: actions/download-artifact@v7
        with:
          name: mautic-apache
          path: image

      - name: Load Apache test image
        run: |
          docker load --input image/image.tar
          docker tag mautic-apache mautic/mautic:latest

      - name: Download extra Docker Images
        run: |
          docker compose --project-name mautic-test -f examples/basic/docker-compose.yml pull
          docker pull ghcr.io/orange-opensource/hurl:latest

      - name: Start test image with demo data
        run: DOCKER_MAUTIC_LOAD_TEST_DATA=true docker compose --project-name mautic-test -f examples/basic/docker-compose.yml up --detach --wait

      - name: Wait for application startup
        run: sleep 30

      - name: Test login endpoint with Hurl
        run: docker run --rm --network mautic-test-docker -v "$PWD/tests:/tests:ro" ghcr.io/orange-opensource/hurl:latest --test -v /tests/login.hurl

      - name: Show logs
        if: always()
        run: docker compose --project-name mautic-test -f examples/basic/docker-compose.yml logs

      - name: Remove test environment
        if: always()
        run: docker compose --project-name mautic-test -f examples/basic/docker-compose.yml down --volumes --remove-orphans

  trivy-image:
    runs-on: ubuntu-latest
    needs: test-build
    permissions:
      security-events: write
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: mautic-${{ matrix.image_type }}

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: image
          image-ref: mautic-${{ matrix.image_type }}
          format: ${{ github.event_name == 'workflow_dispatch' && 'sarif' || 'table' }}
          severity: ${{ github.event_name == 'pull_request' && 'CRITICAL' || '' }}
          exit-code: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          ignore-unfixed: 'true'
          trivyignores: ${{ github.event_name == 'pull_request' && '.trivyignore' || '' }}
          output: ${{ github.event_name == 'workflow_dispatch' && format('trivy-results-{0}.sarif', matrix.image_type) || '' }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name == 'workflow_dispatch'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.image_type }}.sarif

  grype-image:
    runs-on: ubuntu-latest
    continue-on-error: true # Temporary workaround
    needs: test-build
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: mautic-${{ matrix.image_type }}

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Scan Docker image with Grype
        uses: anchore/scan-action@v7
        with:
          image: mautic-${{ matrix.image_type }}
          fail-build: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
          severity-cutoff: critical
          output-format: table

  sbom:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-build
    permissions:
      security-events: write
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: mautic-${{ matrix.image_type }}

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: image
          image-ref: mautic-${{ matrix.image_type }}
          format: github
          output: dependency-results.sbom.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test-demo-data, trivy-image, grype-image, sbom, compute-base-tag, set-build-date, publish-build]
    strategy:
      matrix:
        image_type: [apache, fpm]
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker meta
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            mautic/mautic
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.mautic_version }}
            type=raw,value=${{ inputs.mautic_version }}-${{ needs.set-build-date.outputs.build_date }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.mautic_version }},enable=${{ inputs.overwrite_latest_minor }}
            type=semver,pattern={{major}},value=${{ inputs.mautic_version }},enable=${{ inputs.overwrite_latest_major }}
            type=raw,value=latest,enable=${{ inputs.tag_as_latest && matrix.image_type == 'apache' }},suffix=
          flavor: |
            latest=false
            prefix=
            suffix=-${{ matrix.image_type }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_TAG=${{ needs.compute-base-tag.outputs.php_version }}-${{ matrix.image_type }}-bookworm
            MAUTIC_VERSION=${{ inputs.mautic_version }}
            FLAVOUR=${{ matrix.image_type }}
          cache-from: type=gha,scope=mautic-${{ matrix.image_type }}
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}